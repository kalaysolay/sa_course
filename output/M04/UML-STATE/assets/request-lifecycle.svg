<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1090" viewBox="0 0 820 1090" role="img" aria-labelledby="title desc"><title id="title">Жизненный цикл одного обращения</title><desc id="desc">Начальный узел ведёт в Новое, назначение — в В работе. Из В работе можно запросить уточнение, получить его и вернуться, либо закрыть обращение при записанном основании. Из Закрыто есть явный переход повторного открытия в В работе при наличии полномочия и основания. Закрыто изображено обычным состоянием.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 5L1 9" fill="none" stroke="#17212b" stroke-width="2"/></marker></defs><rect width="820" height="1090" fill="white"/><g font-family="Arial, sans-serif"><text x="30" y="38" font-size="25" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Одно обращение</tspan></text><circle cx="410" cy="72" r="12" fill="#17212b"/><path d="M410 84V112" fill="none" stroke="#17212b" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="300" y="112" width="220" height="64" rx="16" fill="#fff" stroke="#17212b" stroke-width="2"/><text x="410" y="144" font-size="20" text-anchor="middle" fill="#17212b"><tspan x="410" dy="0">Новое</tspan></text><path d="M410 176V280" fill="none" stroke="#17212b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="440" y="226" font-size="19" text-anchor="start" fill="#17212b"><tspan x="440" dy="0">назначено</tspan></text><rect x="300" y="280" width="220" height="80" rx="16" fill="#fff" stroke="#17212b" stroke-width="2"/><text x="410" y="312" font-size="20" text-anchor="middle" fill="#17212b"><tspan x="410" dy="0">В работе</tspan></text><rect x="300" y="565" width="220" height="80" rx="16" fill="#fff" stroke="#17212b" stroke-width="2"/><text x="410" y="597" font-size="20" text-anchor="middle" fill="#17212b"><tspan x="410" dy="0">Ожидает уточнения</tspan></text><rect x="300" y="930" width="220" height="80" rx="16" fill="#fff" stroke="#17212b" stroke-width="2"/><text x="410" y="962" font-size="20" text-anchor="middle" fill="#17212b"><tspan x="410" dy="0">Закрыто</tspan></text><path d="M450 360V565" fill="none" stroke="#17212b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="472" y="422" font-size="18" text-anchor="start" fill="#17212b"><tspan x="472" dy="0">уточнение запрошено</tspan><tspan x="472" dy="27">/ отправить запрос</tspan></text><path d="M300 605H240V320H300" fill="none" stroke="#17212b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="58" y="520" font-size="18" text-anchor="start" fill="#17212b"><tspan x="58" dy="0">уточнение получено</tspan><tspan x="58" dy="27">/ сохранить ответ</tspan></text><path d="M520 320H775V970H520" fill="none" stroke="#17212b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="470" y="755" font-size="18" text-anchor="start" fill="#17212b"><tspan x="470" dy="0">решение подтверждено</tspan><tspan x="470" dy="27">[основание записано]</tspan><tspan x="470" dy="27">/ уведомить сотрудника</tspan></text><path d="M300 970H38V300H300" fill="none" stroke="#17212b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="60" y="690" font-size="18" text-anchor="start" fill="#17212b"><tspan x="60" dy="0">повторное открытие</tspan><tspan x="60" dy="27">запрошено</tspan><tspan x="60" dy="27">[есть полномочие</tspan><tspan x="60" dy="27">и основание]</tspan><tspan x="60" dy="27">/ зарегистрировать</tspan><tspan x="60" dy="27">повторное открытие</tspan></text><text x="410" y="1055" font-size="18" text-anchor="middle" fill="#17212b"><tspan x="410" dy="0">Закрыто допускает повторное открытие: это обычное состояние.</tspan></text></g></svg>