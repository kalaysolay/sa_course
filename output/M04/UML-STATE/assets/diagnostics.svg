<svg xmlns="http://www.w3.org/2000/svg" width="820" height="710" viewBox="0 0 820 710" role="img" aria-labelledby="title desc"><title id="title">Поиск недостижимого состояния</title><desc id="desc">Схема явно помечена как неверная: в состояние Ожидает уточнения нет входящего перехода, есть лишь исходящий уточнение получено. Исправление — добавить переход из В работе по событию уточнение запрошено с эффектом отправить запрос.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 5L1 9" fill="none" stroke="#17212b" stroke-width="2"/></marker></defs><rect width="820" height="710" fill="white"/><g font-family="Arial, sans-serif"><text x="30" y="38" font-size="25" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Ошибка: состояние недостижимо</tspan></text><text x="30" y="78" font-size="20" text-anchor="start" fill="#b42318"><tspan x="30" dy="0">НЕВЕРНАЯ СХЕМА</tspan></text><circle cx="75" cy="160" r="12" fill="#17212b"/><path d="M87 160H150" fill="none" stroke="#17212b" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="150" y="125" width="230" height="70" rx="16" fill="#fff" stroke="#17212b" stroke-width="2"/><text x="265" y="157" font-size="20" text-anchor="middle" fill="#17212b"><tspan x="265" dy="0">В работе</tspan></text><rect x="470" y="330" width="300" height="75" rx="16" fill="#fff" stroke="#17212b" stroke-width="2"/><text x="620" y="362" font-size="20" text-anchor="middle" fill="#17212b"><tspan x="620" dy="0">Ожидает уточнения</tspan></text><path d="M620 330V160H380" fill="none" stroke="#17212b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="425" y="112" font-size="18" text-anchor="start" fill="#17212b"><tspan x="425" dy="0">уточнение получено / сохранить ответ</tspan></text><text x="45" y="267" font-size="19" text-anchor="start" fill="#17212b"><tspan x="45" dy="0">В «Ожидает уточнения» нет входа.</tspan><tspan x="45" dy="27">Путь из начального узла туда не ведёт.</tspan></text><path d="M30 455H790" stroke="#d5dce3"/><text x="30" y="500" font-size="23" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Исправление</tspan></text><text x="30" y="538" font-size="19" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Добавить переход «В работе» → «Ожидает уточнения»:</tspan><tspan x="30" dy="27">уточнение запрошено / отправить запрос.</tspan></text><text x="30" y="620" font-size="18" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Проверка: начальный узел → В работе → Ожидает уточнения.</tspan><tspan x="30" dy="27">Теперь состояние достижимо по названному событию.</tspan></text></g></svg>