<svg xmlns="http://www.w3.org/2000/svg" width="820" height="650" viewBox="0 0 820 650" role="img" aria-labelledby="title desc"><title id="title">Событие, условие и эффект перехода</title><desc id="desc">Между состояниями В работе и Закрыто показан переход с подписью решение подтверждено [основание записано] / уведомить сотрудника. Подпись над линией. Ниже поясняется каждая часть.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 5L1 9" fill="none" stroke="#17212b" stroke-width="2"/></marker></defs><rect width="820" height="650" fill="white"/><g font-family="Arial, sans-serif"><text x="30" y="38" font-size="25" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Подпись перехода</tspan></text><text x="410" y="105" font-size="24" text-anchor="middle" fill="#17212b"><tspan x="410" dy="0">решение подтверждено</tspan></text><text x="410" y="140" font-size="24" text-anchor="middle" fill="#17212b"><tspan x="410" dy="0">[основание записано]</tspan></text><text x="410" y="175" font-size="24" text-anchor="middle" fill="#17212b"><tspan x="410" dy="0">/ уведомить сотрудника</tspan></text><rect x="40" y="215" width="200" height="72" rx="16" fill="#fff" stroke="#17212b" stroke-width="2"/><text x="140" y="247" font-size="20" text-anchor="middle" fill="#17212b"><tspan x="140" dy="0">В работе</tspan></text><rect x="580" y="215" width="200" height="72" rx="16" fill="#fff" stroke="#17212b" stroke-width="2"/><text x="680" y="247" font-size="20" text-anchor="middle" fill="#17212b"><tspan x="680" dy="0">Закрыто</tspan></text><path d="M240 251H580" fill="none" stroke="#17212b" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M30 330H790" stroke="#d5dce3"/><text x="40" y="376" font-size="22" text-anchor="start" fill="#17212b"><tspan x="40" dy="0">решение подтверждено — событие</tspan></text><text x="40" y="407" font-size="18" text-anchor="start" fill="#17212b"><tspan x="40" dy="0">Что произошло и дало повод проверить переход.</tspan></text><text x="40" y="464" font-size="22" text-anchor="start" fill="#17212b"><tspan x="40" dy="0">[основание записано] — условие (guard)</tspan></text><text x="40" y="495" font-size="18" text-anchor="start" fill="#17212b"><tspan x="40" dy="0">Переход разрешён, только если условие истинно.</tspan></text><text x="40" y="552" font-size="22" text-anchor="start" fill="#17212b"><tspan x="40" dy="0">/ уведомить сотрудника — эффект (effect)</tspan></text><text x="40" y="583" font-size="18" text-anchor="start" fill="#17212b"><tspan x="40" dy="0">Что выполняется при переходе в новое состояние.</tspan></text></g></svg>