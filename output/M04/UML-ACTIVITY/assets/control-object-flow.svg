<svg xmlns="http://www.w3.org/2000/svg" width="820" height="655" viewBox="0 0 820 655" role="img" aria-labelledby="title desc"><title id="title">Control flow и object flow</title><desc id="desc">Верхний фрагмент показывает порядок проверки и регистрации. Нижний фрагмент показывает данные Сведения обращения между подготовкой и проверкой, включая output pin и input pin действий.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#17212b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="820" height="655" fill="#fff"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="410" y="34" text-anchor="middle" fill="#17212b" font-size="23"><tspan x="410" dy="0">Порядок действий и передача данных</tspan></text><text x="410" y="63" text-anchor="middle" fill="#335c81" font-size="16"><tspan x="410" dy="0">Два отдельных фрагмента: сравниваем смысл стрелок.</tspan></text><rect x="25" y="100" width="770" height="210" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="410" y="137" text-anchor="middle" fill="#335c81" font-size="21"><tspan x="410" dy="0">Control flow: что выполняется после чего</tspan></text><rect x="80" y="184" width="290" height="72" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="225" y="214" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="225" dy="0">Проверить</tspan><tspan x="225" dy="23.76">полноту</tspan></text><rect x="470" y="184" width="290" height="72" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="615" y="214" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="615" dy="0">Зарегистрировать</tspan><tspan x="615" dy="23.76">обращение</tspan></text><path d="M372,220 H467" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="290" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Стрелка задаёт порядок выполнения.</tspan></text><rect x="25" y="345" width="770" height="275" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="410" y="382" text-anchor="middle" fill="#335c81" font-size="21"><tspan x="410" dy="0">Object flow: какие данные получает действие</tspan></text><rect x="40" y="442" width="220" height="72" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="150" y="472" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="150" dy="0">Подготовить</tspan><tspan x="150" dy="23.76">сведения</tspan></text><rect x="310" y="442" width="200" height="72" rx="0" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="471" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Сведения</tspan><tspan x="410" dy="23.76">обращения</tspan></text><rect x="560" y="442" width="220" height="72" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="670" y="472" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="670" dy="0">Проверить</tspan><tspan x="670" dy="23.76">полноту</tspan></text><rect x="260" y="470" width="10" height="16" rx="0" fill="#fff" stroke="#17212b" stroke-width="2.3"/><rect x="550" y="470" width="10" height="16" rx="0" fill="#fff" stroke="#17212b" stroke-width="2.3"/><path d="M272,478 H307" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M513,478 H547" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="567" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Прямоугольник — object node; маленькие квадраты — pins.</tspan></text><text x="410" y="596" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Объект передаётся между действиями; это не ещё одно действие.</tspan></text></g></svg>