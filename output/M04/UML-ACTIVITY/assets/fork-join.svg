<svg xmlns="http://www.w3.org/2000/svg" width="820" height="765" viewBox="0 0 820 765" role="img" aria-labelledby="title desc"><title id="title">Fork и стандартный AND join</title><desc id="desc">После регистрации fork запускает две обязательные проверки. Join синхронизирует оба потока, после чего составляется рекомендация.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#17212b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="820" height="765" fill="#fff"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="410" y="34" text-anchor="middle" fill="#17212b" font-size="23"><tspan x="410" dy="0">Две обязательные проверки</tspan></text><text x="410" y="63" text-anchor="middle" fill="#335c81" font-size="16"><tspan x="410" dy="0">После fork обе ветви должны дойти до стандартного AND-join.</tspan></text><circle cx="410" cy="98" r="10" fill="#17212b"/><path d="M410,110 V145" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="260" y="147" width="300" height="64" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="173" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Зарегистрировать</tspan><tspan x="410" dy="23.76">обращение</tspan></text><path d="M410,213 V249" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="185" y="252" width="450" height="7" fill="#17212b"/><text x="675" y="260" text-anchor="start" fill="#335c81" font-size="20"><tspan x="675" dy="0">fork</tspan></text><path d="M205,261 V323" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M615,261 V323" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="326" width="290" height="72" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="205" y="356" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="205" dy="0">Проверить</tspan><tspan x="205" dy="23.76">документы</tspan></text><rect x="470" y="326" width="290" height="72" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="615" y="356" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="615" dy="0">Проверить основание</tspan><tspan x="615" dy="23.76">обращения</tspan></text><path d="M205,400 V470" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M615,400 V470" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="185" y="473" width="450" height="7" fill="#17212b"/><text x="667" y="482" text-anchor="start" fill="#335c81" font-size="20"><tspan x="667" dy="0">join (AND)</tspan></text><path d="M410,482 V536" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="250" y="539" width="320" height="72" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="569" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Составить</tspan><tspan x="410" dy="23.76">рекомендацию</tspan></text><path d="M410,613 V658" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="410" cy="679" r="17" fill="#fff" stroke="#17212b" stroke-width="2.3"/><circle cx="410" cy="679" r="10" fill="#17212b"/><text x="410" y="728" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Продолжение — после завершения обеих проверок.</tspan></text></g></svg>