<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1335" viewBox="0 0 820 1335" role="img" aria-labelledby="title desc"><title id="title">Основные символы UML activity diagram</title><desc id="desc">Двенадцать наглядных карточек: действия, control flow, initial, activity final, decision с одним входом и двумя выходами, merge с двумя входами и одним выходом, fork, join, flow final, object node, object flow и дорожки.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#17212b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="820" height="1335" fill="#fff"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="410" y="34" text-anchor="middle" fill="#17212b" font-size="23"><tspan x="410" dy="0">Символы диаграммы активности</tspan></text><text x="410" y="63" text-anchor="middle" fill="#335c81" font-size="16"><tspan x="410" dy="0">Стрелки обозначают направление потока; подписи поясняют символ.</tspan></text><rect x="20" y="90" width="380" height="190" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="210" y="120" text-anchor="middle" fill="#335c81" font-size="20"><tspan x="210" dy="0">Действие</tspan></text><rect x="75" y="162" width="270" height="64" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="210" y="200" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="210" dy="0">Проверить полноту</tspan></text><rect x="420" y="90" width="380" height="190" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="610" y="120" text-anchor="middle" fill="#335c81" font-size="20"><tspan x="610" dy="0">Control flow</tspan></text><path d="M475,190 H745" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="610" y="236" text-anchor="middle" fill="#17212b" font-size="16"><tspan x="610" dy="0">Порядок выполнения</tspan></text><rect x="20" y="295" width="380" height="190" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="210" y="325" text-anchor="middle" fill="#335c81" font-size="20"><tspan x="210" dy="0">Начало · initial</tspan></text><circle cx="210" cy="375" r="10" fill="#17212b"/><path d="M210,386 V442" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="420" y="295" width="380" height="190" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="610" y="325" text-anchor="middle" fill="#335c81" font-size="20"><tspan x="610" dy="0">Конец activity · activity final</tspan></text><path d="M610,357 V397" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="610" cy="420" r="17" fill="#fff" stroke="#17212b" stroke-width="2.3"/><circle cx="610" cy="420" r="10" fill="#17212b"/><text x="610" y="462" text-anchor="middle" fill="#17212b" font-size="16"><tspan x="610" dy="0">Завершает всю activity</tspan></text><rect x="20" y="500" width="380" height="190" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="210" y="530" text-anchor="middle" fill="#335c81" font-size="20"><tspan x="210" dy="0">Выбор · decision</tspan></text><path d="M210,552 V572" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M210,573 L235,598 L210,623 L185,598 Z" fill="#fff" stroke="#17212b" stroke-width="2.3"/><path d="M185,598 H105 V649" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M235,598 H315 V649" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="105" y="673" text-anchor="middle" fill="#17212b" font-size="16"><tspan x="105" dy="0">[да]</tspan></text><text x="315" y="673" text-anchor="middle" fill="#17212b" font-size="16"><tspan x="315" dy="0">[нет]</tspan></text><rect x="420" y="500" width="380" height="190" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="610" y="530" text-anchor="middle" fill="#335c81" font-size="20"><tspan x="610" dy="0">Слияние · merge</tspan></text><path d="M500,560 V600 H585" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M720,560 V600 H635" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M610,575 L635,600 L610,625 L585,600 Z" fill="#fff" stroke="#17212b" stroke-width="2.3"/><path d="M610,625 V666" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="20" y="705" width="380" height="190" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="210" y="735" text-anchor="middle" fill="#335c81" font-size="20"><tspan x="210" dy="0">Разделение · fork</tspan></text><path d="M210,760 V791" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="95" y="795" width="230" height="7" fill="#17212b"/><path d="M125,803 V862" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M295,803 V862" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="420" y="705" width="380" height="190" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="610" y="735" text-anchor="middle" fill="#335c81" font-size="20"><tspan x="610" dy="0">Синхронизация · join (AND)</tspan></text><path d="M525,760 V810" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M695,760 V810" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="495" y="814" width="230" height="7" fill="#17212b"/><path d="M610,822 V868" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="20" y="910" width="380" height="190" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="210" y="940" text-anchor="middle" fill="#335c81" font-size="20"><tspan x="210" dy="0">Конец ветви · flow final</tspan></text><path d="M210,965 V1009" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="210" cy="1033" r="18" fill="#fff" stroke="#17212b" stroke-width="2.3"/><path d="M201,1024 L219,1042 M219,1024 L201,1042" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="1077" text-anchor="middle" fill="#17212b" font-size="16"><tspan x="210" dy="0">Другие потоки продолжаются</tspan></text><rect x="420" y="910" width="380" height="190" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="610" y="940" text-anchor="middle" fill="#335c81" font-size="20"><tspan x="610" dy="0">Object node</tspan></text><rect x="500" y="984" width="220" height="65" rx="0" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="610" y="1010" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="610" dy="0">Сведения</tspan><tspan x="610" dy="23.76">обращения</tspan></text><rect x="20" y="1115" width="380" height="190" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="210" y="1145" text-anchor="middle" fill="#335c81" font-size="20"><tspan x="210" dy="0">Object flow</tspan></text><rect x="140" y="1192" width="140" height="55" rx="0" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="210" y="1224" text-anchor="middle" fill="#17212b" font-size="16"><tspan x="210" dy="0">Обращение</tspan></text><path d="M55,1220 H137" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M283,1220 H365" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="210" y="1279" text-anchor="middle" fill="#17212b" font-size="16"><tspan x="210" dy="0">Передача данных через object node</tspan></text><rect x="420" y="1115" width="380" height="190" rx="8" fill="#fff" stroke="#c6d1db" stroke-width="2.3"/><text x="610" y="1145" text-anchor="middle" fill="#335c81" font-size="20"><tspan x="610" dy="0">Дорожки · swimlanes</tspan></text><rect x="460" y="1173" width="300" height="112" rx="0" fill="#fff" stroke="#17212b" stroke-width="2.3"/><path d="M610,1173 V1285" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M460,1205 H760" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="1196" text-anchor="middle" fill="#17212b" font-size="16"><tspan x="535" dy="0">Сотрудник</tspan></text><text x="685" y="1196" text-anchor="middle" fill="#17212b" font-size="16"><tspan x="685" dy="0">Система</tspan></text><rect x="475" y="1222" width="120" height="42" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="535" y="1249" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="535" dy="0">Отправить</tspan></text><rect x="625" y="1222" width="120" height="42" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="685" y="1249" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="685" dy="0">Проверить</tspan></text></g></svg>