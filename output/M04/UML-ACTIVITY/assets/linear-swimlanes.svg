<svg xmlns="http://www.w3.org/2000/svg" width="820" height="920" viewBox="0 0 820 920" role="img" aria-labelledby="title desc"><title id="title">Линейный процесс в трёх дорожках</title><desc id="desc">Сотрудник подготавливает и отправляет обращение. Система проверяет полноту и регистрирует. Офицер рассматривает и фиксирует решение. Система сообщает результат.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#17212b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="820" height="920" fill="#fff"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="410" y="34" text-anchor="middle" fill="#17212b" font-size="23"><tspan x="410" dy="0">Последовательность действий</tspan></text><text x="410" y="63" text-anchor="middle" fill="#335c81" font-size="16"><tspan x="410" dy="0">Учебный пример: одно обращение; успешный путь без уточнений.</tspan></text><rect x="20" y="90" width="260" height="800" rx="0" fill="#fff" stroke="#17212b" stroke-width="2.3"/><rect x="20" y="90" width="260" height="48" rx="0" fill="#edf2f6" stroke="#17212b" stroke-width="2.3"/><text x="150" y="120" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="150" dy="0">Сотрудник</tspan></text><rect x="280" y="90" width="260" height="800" rx="0" fill="#fff" stroke="#17212b" stroke-width="2.3"/><rect x="280" y="90" width="260" height="48" rx="0" fill="#edf2f6" stroke="#17212b" stroke-width="2.3"/><text x="410" y="120" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Система</tspan></text><rect x="540" y="90" width="260" height="800" rx="0" fill="#fff" stroke="#17212b" stroke-width="2.3"/><rect x="540" y="90" width="260" height="48" rx="0" fill="#edf2f6" stroke="#17212b" stroke-width="2.3"/><text x="670" y="120" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="670" dy="0">Комплаенс-офицер</tspan></text><circle cx="150" cy="160" r="10" fill="#17212b"/><path d="M150,171 V188" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="190" width="220" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="150" y="214" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="150" dy="0">Подготовить</tspan><tspan x="150" dy="23.76">обращение</tspan></text><path d="M150,251 V267 H150 V283" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="285" width="220" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="150" y="309" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="150" dy="0">Отправить</tspan><tspan x="150" dy="23.76">обращение</tspan></text><path d="M150,346 V362 H410 V378" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="300" y="380" width="220" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="404" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Проверить</tspan><tspan x="410" dy="23.76">полноту</tspan></text><path d="M410,441 V457 H410 V473" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="300" y="475" width="220" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="499" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Зарегистрировать</tspan><tspan x="410" dy="23.76">обращение</tspan></text><path d="M410,536 V552 H670 V568" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="560" y="570" width="220" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="670" y="594" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="670" dy="0">Рассмотреть</tspan><tspan x="670" dy="23.76">обращение</tspan></text><path d="M670,631 V647 H670 V663" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="560" y="665" width="220" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="670" y="689" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="670" dy="0">Зафиксировать</tspan><tspan x="670" dy="23.76">решение</tspan></text><path d="M670,726 V742 H410 V758" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="300" y="760" width="220" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="784" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Сообщить</tspan><tspan x="410" dy="23.76">результат</tspan></text><path d="M410,821 V852" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="410" cy="872" r="17" fill="#fff" stroke="#17212b" stroke-width="2.3"/><circle cx="410" cy="872" r="10" fill="#17212b"/></g></svg>