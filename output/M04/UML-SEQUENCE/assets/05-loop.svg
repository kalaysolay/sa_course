<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img"><title>Compliance: проверка конечного списка</title><defs><marker id="sync" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#16324f"/></marker><marker id="open" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10" fill="none" stroke="#16324f" stroke-width="1.8"/></marker></defs><rect width="1000" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#16324f;font-size:16px}.title{font-size:23px;font-weight:bold}.small{font-size:14px}.life{stroke:#8193a5;stroke-width:1.5;stroke-dasharray:6 5}.box{fill:#eef5fc;stroke:#16324f;stroke-width:1.5}</style><text x="25" y="35" class="title" text-anchor="start">Compliance: проверка конечного списка</text><rect x="180" y="60" width="180" height="48" rx="4" class="box"/><text x="270" y="89" class="" text-anchor="middle">Экран Compliance</text><line x1="270" y1="108" x2="270" y2="375" class="life"/><rect x="640" y="60" width="180" height="48" rx="4" class="box"/><text x="730" y="89" class="" text-anchor="middle">Сервис проверки</text><line x1="730" y1="108" x2="730" y2="375" class="life"/><rect x="35" y="145" width="930" height="200" fill="white" fill-opacity="0.8" stroke="#16324f" stroke-width="1.5"/><path d="M35,174 H97 L112,159 V145" fill="#eef5fc" stroke="#16324f"/><text x="47" y="166" class="" text-anchor="start">loop</text><text x="130" y="175" class="" text-anchor="start">[для каждого контрагента из списка]</text><rect x="724" y="225" width="12" height="65" class="box"/><line x1="270" y1="225" x2="724" y2="225" stroke="#16324f" stroke-width="2"  marker-end="url(#sync)"/><text x="497" y="215" class="small" text-anchor="middle">Проверить текущего контрагента</text><line x1="724" y1="290" x2="270" y2="290" stroke="#16324f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="497" y="280" class="small" text-anchor="middle">Результат текущего контрагента</text><text x="25" y="390" class="small" text-anchor="start">Легенда: loop — повтор всего содержимого рамки; sync — вызов, reply — возврат.</text></svg>