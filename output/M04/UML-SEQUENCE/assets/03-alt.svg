<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img"><title>Compliance: альтернативный результат</title><defs><marker id="sync" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#16324f"/></marker><marker id="open" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10" fill="none" stroke="#16324f" stroke-width="1.8"/></marker></defs><rect width="1000" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#16324f;font-size:16px}.title{font-size:23px;font-weight:bold}.small{font-size:14px}.life{stroke:#8193a5;stroke-width:1.5;stroke-dasharray:6 5}.box{fill:#eef5fc;stroke:#16324f;stroke-width:1.5}</style><text x="25" y="35" class="title" text-anchor="start">Compliance: альтернативный результат</text><rect x="180" y="60" width="180" height="48" rx="4" class="box"/><text x="270" y="89" class="" text-anchor="middle">Экран Compliance</text><line x1="270" y1="108" x2="270" y2="435" class="life"/><rect x="640" y="60" width="180" height="48" rx="4" class="box"/><text x="730" y="89" class="" text-anchor="middle">Сервис проверки</text><line x1="730" y1="108" x2="730" y2="435" class="life"/><line x1="270" y1="145" x2="730" y2="145" stroke="#16324f" stroke-width="2"  marker-end="url(#sync)"/><text x="497" y="135" class="small" text-anchor="middle">Выполнить проверку</text><rect x="35" y="195" width="930" height="220" fill="white" fill-opacity="0.8" stroke="#16324f" stroke-width="1.5"/><path d="M35,224 H97 L112,209 V195" fill="#eef5fc" stroke="#16324f"/><text x="47" y="216" class="" text-anchor="start">alt</text><text x="130" y="222" class="" text-anchor="start">[риск найден]</text><line x1="730" y1="265" x2="270" y2="265" stroke="#16324f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="500" y="255" class="small" text-anchor="middle">Риск найден: требуется разбор</text><line x1="35" y1="300" x2="965" y2="300" class="life"/><text x="130" y="328" class="" text-anchor="start">[else]</text><line x1="730" y1="375" x2="270" y2="375" stroke="#16324f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="500" y="365" class="small" text-anchor="middle">Риск не найден</text><text x="25" y="460" class="small" text-anchor="start">Легенда: alt — выбор ветви; пунктирная стрелка с открытым наконечником — reply.</text></svg>