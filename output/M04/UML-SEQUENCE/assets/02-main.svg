<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img"><title>Compliance: успешная проверка</title><defs><marker id="sync" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#16324f"/></marker><marker id="open" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10" fill="none" stroke="#16324f" stroke-width="1.8"/></marker></defs><rect width="1000" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#16324f;font-size:16px}.title{font-size:23px;font-weight:bold}.small{font-size:14px}.life{stroke:#8193a5;stroke-width:1.5;stroke-dasharray:6 5}.box{fill:#eef5fc;stroke:#16324f;stroke-width:1.5}</style><text x="25" y="35" class="title" text-anchor="start">Compliance: успешная проверка</text><rect x="30" y="60" width="180" height="48" rx="4" class="box"/><text x="120" y="89" class="" text-anchor="middle">Сотрудник</text><line x1="120" y1="108" x2="120" y2="505" class="life"/><rect x="280" y="60" width="180" height="48" rx="4" class="box"/><text x="370" y="89" class="" text-anchor="middle">Экран Compliance</text><line x1="370" y1="108" x2="370" y2="505" class="life"/><rect x="530" y="60" width="180" height="48" rx="4" class="box"/><text x="620" y="89" class="" text-anchor="middle">Сервис проверки</text><line x1="620" y1="108" x2="620" y2="505" class="life"/><rect x="780" y="60" width="180" height="48" rx="4" class="box"/><text x="870" y="89" class="" text-anchor="middle">Источник данных</text><line x1="870" y1="108" x2="870" y2="505" class="life"/><rect x="364" y="150" width="12" height="280" class="box"/><rect x="614" y="210" width="12" height="160" class="box"/><rect x="864" y="270" width="12" height="50" class="box"/><line x1="120" y1="150" x2="364" y2="150" stroke="#16324f" stroke-width="2"  marker-end="url(#sync)"/><text x="242" y="140" class="small" text-anchor="middle">1. Проверить контрагента</text><line x1="376" y1="210" x2="614" y2="210" stroke="#16324f" stroke-width="2"  marker-end="url(#sync)"/><text x="495" y="200" class="small" text-anchor="middle">2. Выполнить проверку</text><line x1="626" y1="270" x2="864" y2="270" stroke="#16324f" stroke-width="2"  marker-end="url(#sync)"/><text x="745" y="260" class="small" text-anchor="middle">3. Получить сведения</text><line x1="864" y1="320" x2="626" y2="320" stroke="#16324f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="745" y="310" class="small" text-anchor="middle">4. Сведения</text><line x1="614" y1="370" x2="376" y2="370" stroke="#16324f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="495" y="360" class="small" text-anchor="middle">5. Результат проверки</text><line x1="364" y1="430" x2="120" y2="430" stroke="#16324f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="242" y="420" class="small" text-anchor="middle">6. Показать результат</text><text x="25" y="520" class="small" text-anchor="start">Легенда: сплошная + закрашенная — sync; пунктир + открытая — reply. Читаем сверху вниз.</text></svg>