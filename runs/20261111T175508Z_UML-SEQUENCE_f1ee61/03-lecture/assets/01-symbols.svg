<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img"><title>Символы: участник, выполнение и сообщения</title><defs><marker id="sync" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#16324f"/></marker><marker id="open" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10" fill="none" stroke="#16324f" stroke-width="1.8"/></marker></defs><rect width="1000" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#16324f;font-size:16px}.title{font-size:23px;font-weight:bold}.small{font-size:14px}.life{stroke:#8193a5;stroke-width:1.5;stroke-dasharray:6 5}.box{fill:#eef5fc;stroke:#16324f;stroke-width:1.5}</style><text x="25" y="35" class="title" text-anchor="start">Символы: участник, выполнение и сообщения</text><rect x="55" y="75" width="180" height="48" rx="4" class="box"/><text x="145" y="104" class="" text-anchor="middle">Сервис проверки</text><line x1="145" y1="123" x2="145" y2="380" class="life"/><rect x="139" y="190" width="12" height="105" class="box"/><text x="260" y="102" class="" text-anchor="start">Голова lifeline — имя участника</text><text x="260" y="157" class="" text-anchor="start">Lifeline — линия жизни участника</text><text x="260" y="212" class="" text-anchor="start">Activation — период выполнения</text><line x1="420" y1="275" x2="650" y2="275" stroke="#16324f" stroke-width="2"  marker-end="url(#sync)"/><text x="535" y="265" class="small" text-anchor="middle">sync: синхронный вызов</text><line x1="420" y1="330" x2="650" y2="330" stroke="#16324f" stroke-width="2"  marker-end="url(#open)"/><text x="535" y="320" class="small" text-anchor="middle">async: асинхронное сообщение</text><line x1="650" y1="385" x2="420" y2="385" stroke="#16324f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/><text x="535" y="375" class="small" text-anchor="middle">reply: возврат результата</text><text x="695" y="280" class="small" text-anchor="start">Сплошная, закрашенный наконечник</text><text x="695" y="335" class="small" text-anchor="start">Сплошная, открытый наконечник</text><text x="695" y="390" class="small" text-anchor="start">Пунктир, открытый наконечник</text></svg>