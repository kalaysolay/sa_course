<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img"><title>Compliance: необязательное уведомление</title><defs><marker id="sync" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#16324f"/></marker><marker id="open" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10" fill="none" stroke="#16324f" stroke-width="1.8"/></marker></defs><rect width="1000" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#16324f;font-size:16px}.title{font-size:23px;font-weight:bold}.small{font-size:14px}.life{stroke:#8193a5;stroke-width:1.5;stroke-dasharray:6 5}.box{fill:#eef5fc;stroke:#16324f;stroke-width:1.5}</style><text x="25" y="35" class="title" text-anchor="start">Compliance: необязательное уведомление</text><rect x="180" y="60" width="180" height="48" rx="4" class="box"/><text x="270" y="89" class="" text-anchor="middle">Сервис проверки</text><line x1="270" y1="108" x2="270" y2="335" class="life"/><rect x="640" y="60" width="180" height="48" rx="4" class="box"/><text x="730" y="89" class="" text-anchor="middle">Сервис уведомлений</text><line x1="730" y1="108" x2="730" y2="335" class="life"/><rect x="35" y="145" width="930" height="150" fill="white" fill-opacity="0.8" stroke="#16324f" stroke-width="1.5"/><path d="M35,174 H97 L112,159 V145" fill="#eef5fc" stroke="#16324f"/><text x="47" y="166" class="" text-anchor="start">opt</text><text x="130" y="174" class="" text-anchor="start">[уведомление включено]</text><line x1="270" y1="230" x2="730" y2="230" stroke="#16324f" stroke-width="2"  marker-end="url(#open)"/><text x="500" y="220" class="small" text-anchor="middle">Результат проверки готов</text><rect x="724" y="230" width="12" height="35" class="box"/><text x="25" y="345" class="small" text-anchor="start">Легенда: opt — выполнить или пропустить; сплошная стрелка с открытым наконечником — async.</text></svg>