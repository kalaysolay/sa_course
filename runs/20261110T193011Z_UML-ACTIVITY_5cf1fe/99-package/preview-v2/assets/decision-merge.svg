<svg xmlns="http://www.w3.org/2000/svg" width="820" height="720" viewBox="0 0 820 720" role="img" aria-labelledby="title desc"><title id="title">Выбор канала ответа с явным merge</title><desc id="desc">Decision выбирает между почтой и личным кабинетом. После разных действий две альтернативы приходят в подписанный merge и продолжаются общим действием фиксации способа ответа.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#17212b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="820" height="720" fill="#fff"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="410" y="34" text-anchor="middle" fill="#17212b" font-size="23"><tspan x="410" dy="0">Выбор канала ответа и merge</tspan></text><text x="410" y="63" text-anchor="middle" fill="#335c81" font-size="16"><tspan x="410" dy="0">Допущение: готовый ответ отправляют ровно по одному выбранному каналу.</tspan></text><circle cx="410" cy="100" r="10" fill="#17212b"/><path d="M410,111 V150" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="125" text-anchor="start" fill="#17212b" font-size="18"><tspan x="480" dy="0">Выбранный канал</tspan><tspan x="480" dy="23.76">ответа?</tspan></text><path d="M410,154 L440,184 L410,214 L380,184 Z" fill="#fff" stroke="#17212b" stroke-width="2.3"/><path d="M380,184 H205 V265" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M440,184 H615 V265" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="205" y="224" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="205" dy="0">[почта]</tspan></text><text x="615" y="224" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="615" dy="0">[личный кабинет]</tspan></text><rect x="60" y="268" width="290" height="72" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="205" y="298" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="205" dy="0">Отправить ответ</tspan><tspan x="205" dy="23.76">по почте</tspan></text><rect x="470" y="268" width="290" height="72" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="615" y="298" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="615" dy="0">Разместить ответ</tspan><tspan x="615" dy="23.76">в личном кабинете</tspan></text><path d="M205,342 V403 H380" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M615,342 V403 H440" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M410,373 L440,403 L410,433 L380,403 Z" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="465" y="382" text-anchor="start" fill="#335c81" font-size="20"><tspan x="465" dy="0">merge</tspan></text><path d="M410,435 V480" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="245" y="482" width="330" height="72" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="512" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Зафиксировать</tspan><tspan x="410" dy="23.76">способ ответа</tspan></text><path d="M410,556 V607" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="410" cy="629" r="17" fill="#fff" stroke="#17212b" stroke-width="2.3"/><circle cx="410" cy="629" r="10" fill="#17212b"/><text x="410" y="685" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Два входа, один выход. Merge не ждёт вторую альтернативу.</tspan></text></g></svg>