<svg xmlns="http://www.w3.org/2000/svg" width="820" height="775" viewBox="0 0 820 775" role="img" aria-labelledby="title desc"><title id="title">Flow final и activity final в параллельных потоках</title><desc id="desc">После fork напоминание завершается flow final, а рассмотрение и фиксация решения activity final. Flow final не прерывает рассмотрение, activity final прекращает все ещё выполняющиеся потоки этой activity.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#17212b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="820" height="775" fill="#fff"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="410" y="34" text-anchor="middle" fill="#17212b" font-size="23"><tspan x="410" dy="0">Конец ветви и конец всей activity</tspan></text><text x="410" y="63" text-anchor="middle" fill="#335c81" font-size="16"><tspan x="410" dy="0">Два независимых потока; синхронизирующего join здесь нет.</tspan></text><circle cx="410" cy="100" r="10" fill="#17212b"/><path d="M410,112 V153" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="185" y="156" width="450" height="7" fill="#17212b"/><text x="670" y="165" text-anchor="start" fill="#335c81" font-size="20"><tspan x="670" dy="0">fork</tspan></text><path d="M205,165 V230" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M615,165 V230" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="233" width="290" height="72" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="205" y="263" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="205" dy="0">Отправить</tspan><tspan x="205" dy="23.76">напоминание</tspan></text><rect x="470" y="233" width="290" height="72" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="615" y="263" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="615" dy="0">Рассмотреть</tspan><tspan x="615" dy="23.76">обращение</tspan></text><path d="M615,307 V339" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="470" y="341" width="290" height="64" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="615" y="367" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="615" dy="0">Зафиксировать</tspan><tspan x="615" dy="23.76">решение</tspan></text><path d="M205,307 V466" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M615,407 V466" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="205" cy="487" r="18" fill="#fff" stroke="#17212b" stroke-width="2.3"/><path d="M196,478 L214,496 M214,478 L196,496" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="615" cy="487" r="17" fill="#fff" stroke="#17212b" stroke-width="2.3"/><circle cx="615" cy="487" r="10" fill="#17212b"/><text x="205" y="544" text-anchor="middle" fill="#335c81" font-size="21"><tspan x="205" dy="0">flow final</tspan></text><text x="205" y="578" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="205" dy="0">Завершает только</tspan><tspan x="205" dy="23.76">ветвь напоминания.</tspan></text><text x="615" y="544" text-anchor="middle" fill="#335c81" font-size="21"><tspan x="615" dy="0">activity final</tspan></text><text x="615" y="578" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="615" dy="0">Завершает всю activity,</tspan><tspan x="615" dy="23.76">включая другую ветвь.</tspan></text><text x="410" y="675" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Если напоминание закончилось первым, рассмотрение продолжается.</tspan><tspan x="410" dy="23.76">Если решение зафиксировано и достигнут activity final первым,</tspan><tspan x="410" dy="23.76">незавершённая ветвь напоминания прерывается.</tspan></text></g></svg>