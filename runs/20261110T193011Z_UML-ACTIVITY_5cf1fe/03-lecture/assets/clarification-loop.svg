<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1090" viewBox="0 0 820 1090" role="img" aria-labelledby="title desc"><title id="title">Цикл уточнения с явным merge</title><desc id="desc">Первоначальный вход и обратный путь соединяются в merge перед подготовкой обращения. Неполные данные возвращают сотрудника на уточнение; полные данные ведут к регистрации и рассмотрению.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#17212b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="820" height="1090" fill="#fff"/><g font-family="Arial, DejaVu Sans, sans-serif"><text x="410" y="34" text-anchor="middle" fill="#17212b" font-size="23"><tspan x="410" dy="0">Возврат за уточнением</tspan></text><text x="410" y="63" text-anchor="middle" fill="#335c81" font-size="16"><tspan x="410" dy="0">Учебный пример: проверка полноты до регистрации обращения.</tspan></text><circle cx="410" cy="95" r="10" fill="#17212b"/><path d="M410,107 V129" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M410,131 L434,155 L410,179 L386,155 Z" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="458" y="163" text-anchor="start" fill="#335c81" font-size="20"><tspan x="458" dy="0">merge</tspan></text><path d="M410,181 V214" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="280" y="216" width="260" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="240" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Подготовить</tspan><tspan x="410" dy="23.76">обращение</tspan></text><path d="M410,278 V313" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="280" y="315" width="260" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="339" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Отправить</tspan><tspan x="410" dy="23.76">обращение</tspan></text><path d="M410,377 V413" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="280" y="415" width="260" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="439" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Проверить</tspan><tspan x="410" dy="23.76">полноту</tspan></text><path d="M410,477 V523" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M410,525 L440,555 L410,585 L380,555 Z" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="460" y="559" text-anchor="start" fill="#17212b" font-size="18"><tspan x="460" dy="0">Данных достаточно?</tspan></text><path d="M380,555 H170 V488" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="250" y="543" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="250" dy="0">[нет]</tspan></text><rect x="65" y="415" width="210" height="70" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="170" y="444" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="170" dy="0">Сообщить,</tspan><tspan x="170" dy="23.76">чего не хватает</tspan></text><path d="M170,413 V155 H384" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="183" y="123" text-anchor="middle" fill="#335c81" font-size="16"><tspan x="183" dy="0">Возврат</tspan></text><text x="410" y="620" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">[да]</tspan></text><path d="M410,587 V654" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="280" y="656" width="260" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="680" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Зарегистрировать</tspan><tspan x="410" dy="23.76">обращение</tspan></text><path d="M410,718 V748" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="280" y="750" width="260" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="774" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Рассмотреть</tspan><tspan x="410" dy="23.76">обращение</tspan></text><path d="M410,812 V842" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="280" y="844" width="260" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="868" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Зафиксировать</tspan><tspan x="410" dy="23.76">решение</tspan></text><path d="M410,906 V936" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="280" y="938" width="260" height="60" rx="13" fill="#fff" stroke="#17212b" stroke-width="2.3"/><text x="410" y="962" text-anchor="middle" fill="#17212b" font-size="18"><tspan x="410" dy="0">Сообщить</tspan><tspan x="410" dy="23.76">результат</tspan></text><path d="M410,1000 V1033" fill="none" stroke="#17212b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="410" cy="1053" r="17" fill="#fff" stroke="#17212b" stroke-width="2.3"/><circle cx="410" cy="1053" r="10" fill="#17212b"/></g></svg>