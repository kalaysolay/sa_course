<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1210" viewBox="0 0 820 1210" role="img" aria-labelledby="title desc"><title id="title">Порядок выхода и входа, внешняя петля и внутренняя обработка</title><desc id="desc">Верхняя схема показывает переход В работе в Ожидает уточнения и порядок exit, effect, entry. Ниже показаны два варианта обработки события комментарий получен: внешняя петля с повторным выходом и входом и внутренняя обработка без них.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 5L1 9" fill="none" stroke="#17212b" stroke-width="2"/></marker></defs><rect width="820" height="1210" fill="white"/><g font-family="Arial, sans-serif"><text x="30" y="38" font-size="25" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Выход → эффект → вход</tspan></text><rect x="30" y="80" width="350" height="160" rx="16" fill="#fff" stroke="#17212b" stroke-width="2"/><text x="205" y="112" font-size="20" text-anchor="middle" fill="#17212b"><tspan x="205" dy="0">В работе</tspan></text><path d="M30 128h350" stroke="#17212b"/><text x="46" y="158" font-size="18" text-anchor="start" fill="#17212b"><tspan x="46" dy="0">entry / начать отсчёт работы</tspan><tspan x="46" dy="27">exit / остановить отсчёт работы</tspan></text><rect x="440" y="80" width="350" height="160" rx="16" fill="#fff" stroke="#17212b" stroke-width="2"/><text x="615" y="112" font-size="20" text-anchor="middle" fill="#17212b"><tspan x="615" dy="0">Ожидает уточнения</tspan></text><path d="M440 128h350" stroke="#17212b"/><text x="456" y="158" font-size="18" text-anchor="start" fill="#17212b"><tspan x="456" dy="0">entry / включить напоминание</tspan><tspan x="456" dy="27">exit / выключить напоминание</tspan></text><path d="M205 240V350H615V240" fill="none" stroke="#17212b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="410" y="294" font-size="19" text-anchor="middle" fill="#17212b"><tspan x="410" dy="0">уточнение запрошено</tspan><tspan x="410" dy="27">/ отправить запрос</tspan></text><text x="40" y="405" font-size="20" text-anchor="start" fill="#17212b"><tspan x="40" dy="0">1. exit: остановить отсчёт работы</tspan><tspan x="40" dy="27">2. effect: отправить запрос</tspan><tspan x="40" dy="27">3. entry: включить напоминание</tspan></text><path d="M30 505H790" stroke="#d5dce3"/><text x="30" y="550" font-size="24" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Внешняя петля</tspan></text><text x="30" y="585" font-size="18" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Событие возвращает объект в то же состояние.</tspan></text><rect x="60" y="700" width="370" height="150" rx="16" fill="#fff" stroke="#17212b" stroke-width="2"/><text x="245" y="732" font-size="20" text-anchor="middle" fill="#17212b"><tspan x="245" dy="0">В работе</tspan></text><path d="M60 748h370" stroke="#17212b"/><text x="76" y="778" font-size="18" text-anchor="start" fill="#17212b"><tspan x="76" dy="0">entry / начать отсчёт работы</tspan><tspan x="76" dy="27">exit / остановить отсчёт работы</tspan></text><path d="M150 700V660H510V775H430" fill="none" stroke="#17212b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="320" y="620" font-size="18" text-anchor="middle" fill="#17212b"><tspan x="320" dy="0">комментарий получен / сохранить комментарий</tspan></text><text x="470" y="820" font-size="18" text-anchor="start" fill="#17212b"><tspan x="470" dy="0">exit → эффект → entry</tspan><tspan x="470" dy="27">Отсчёт остановится</tspan><tspan x="470" dy="27">и начнётся заново.</tspan></text><path d="M30 890H790" stroke="#d5dce3"/><text x="30" y="934" font-size="24" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Внутренняя обработка</tspan></text><rect x="60" y="970" width="700" height="160" rx="16" fill="#fff" stroke="#17212b" stroke-width="2"/><text x="410" y="1002" font-size="20" text-anchor="middle" fill="#17212b"><tspan x="410" dy="0">В работе</tspan></text><path d="M60 1018h700" stroke="#17212b"/><text x="76" y="1048" font-size="18" text-anchor="start" fill="#17212b"><tspan x="76" dy="0">entry / начать отсчёт работы</tspan><tspan x="76" dy="27">exit / остановить отсчёт работы</tspan><tspan x="76" dy="27">комментарий получен / сохранить комментарий</tspan></text><text x="60" y="1170" font-size="18" text-anchor="start" fill="#17212b"><tspan x="60" dy="0">Сохранить комментарий. Без exit и entry; отсчёт продолжается.</tspan></text></g></svg>