<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-labelledby="title desc"><title id="title">Четыре обозначения диаграммы состояний</title><desc id="desc">Наглядные образцы: состояние — скруглённый прямоугольник; переход — направленная линия; начальный узел — чёрный круг; конечное состояние — круг с чёрным центром.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 5L1 9" fill="none" stroke="#17212b" stroke-width="2"/></marker></defs><rect width="820" height="560" fill="white"/><g font-family="Arial, sans-serif"><text x="30" y="38" font-size="25" text-anchor="start" fill="#17212b"><tspan x="30" dy="0">Обозначения UML</tspan></text><rect x="50" y="78" width="220" height="70" rx="16" fill="#fff" stroke="#17212b" stroke-width="2"/><text x="160" y="110" font-size="20" text-anchor="middle" fill="#17212b"><tspan x="160" dy="0">В работе</tspan></text><text x="320" y="108" font-size="21" text-anchor="start" fill="#17212b"><tspan x="320" dy="0">Состояние</tspan></text><text x="320" y="138" font-size="18" text-anchor="start" fill="#17212b"><tspan x="320" dy="0">Ситуация, в которой находится объект.</tspan></text><path d="M30 180H790" stroke="#d5dce3"/><path d="M70 235H260" fill="none" stroke="#17212b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="320" y="225" font-size="21" text-anchor="start" fill="#17212b"><tspan x="320" dy="0">Переход</tspan></text><text x="320" y="255" font-size="18" text-anchor="start" fill="#17212b"><tspan x="320" dy="0">Направление смены состояния.</tspan></text><path d="M30 292H790" stroke="#d5dce3"/><circle cx="160" cy="350" r="15" fill="#17212b"/><text x="320" y="337" font-size="21" text-anchor="start" fill="#17212b"><tspan x="320" dy="0">Начальный узел</tspan></text><text x="320" y="367" font-size="18" text-anchor="start" fill="#17212b"><tspan x="320" dy="0">Отсюда начинается модель.</tspan></text><path d="M30 408H790" stroke="#d5dce3"/><circle cx="160" cy="477" r="20" fill="white" stroke="#17212b" stroke-width="2.4"/><circle cx="160" cy="477" r="12" fill="#17212b"/><text x="320" y="464" font-size="21" text-anchor="start" fill="#17212b"><tspan x="320" dy="0">Конечное состояние (FinalState)</tspan></text><text x="320" y="494" font-size="18" text-anchor="start" fill="#17212b"><tspan x="320" dy="0">Жизненный цикл в этой модели завершён.</tspan><tspan x="320" dy="27">Исходящих переходов нет.</tspan></text></g></svg>