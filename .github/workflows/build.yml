# Сборка бэкенда: компиляция + тесты + ArchUnit.
# Триггеры отключены (спам из почты): запуск только вручную из Actions.
# Вернуть автозапуск — раскомментировать push/pull_request ниже.
name: backend-build

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'analystgym/backend/**'
  #     - '.github/workflows/build.yml'
  # pull_request:
  #   paths:
  #     - 'analystgym/backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analystgym/backend
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Session integration tests (PostgreSQL)
        run: ./gradlew :app:integrationTest --no-daemon

      - name: Browser session logic
        working-directory: analystgym/tasks-mockup
        run: node --test tests/session.test.cjs
