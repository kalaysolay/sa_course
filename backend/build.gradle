// Общие настройки всех подпроектов.
// Версии Spring-библиотек — только здесь (BOM), в модулях версий нет.
// Java 21 через toolchain: Gradle сам скачает JDK при необходимости.
plugins {
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

allprojects {
    group = 'ru.analystgym'
    version = '0.1.0'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.4.1'
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Spring MVC/Security читают имена параметров (@RequestParam String level)
        // из байткода: без -parameters такие эндпоинты падают в 500/401
        // (проверено живьём на GET /api/tasks).
        options.compilerArgs += '-parameters'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
