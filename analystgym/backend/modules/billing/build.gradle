// Модуль billing: заказы, Pro-подписки, промокоды, адаптер провайдера (Фаза 4)
// + предзапись на Pro (WaitlistService): paywall в UI заменён заявкой,
// спрос меряем до запуска платежей.
// practice зависит от billing (квота бесплатных ревью), обратно — нет.
dependencies {
    implementation project(':shared:persistence')
    implementation project(':modules:identity')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
