// Модуль assessment: диагностика, подсчёт, планы прокачки (Фаза 3).
// Читает вопросы из своей таблицы, задачи — из catalog, факт решения —
// из practice (reviewed-попытки для плана). Циклов нет (см. ModuleBoundariesTest).
dependencies {
    implementation project(':shared:persistence')
    implementation project(':modules:catalog')
    implementation project(':modules:practice')
    implementation project(':modules:identity')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
