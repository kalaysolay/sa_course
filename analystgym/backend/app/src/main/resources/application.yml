server:
  port: 8080
  forward-headers-strategy: native

# Версия сборки для /api/health. Значение по умолчанию — чтобы приложение
# стартовало и без подстановки из Gradle (локальный запуск из IDE).
app:
  version: 0.1.0-dev
  # Вход через Google (OAuth2 code flow): выключен без ключей.
  google:
    enabled: ${APP_GOOGLE_ENABLED:false}
    client-id: ${AUTH_GOOGLE_CLIENT_ID:}
    client-secret: ${AUTH_GOOGLE_SECRET:}
    success-url: /account.html
    failure-url: /login.html?error=oauth
  # Сайт: внешний базовый URL для ссылок в письмах (сброс пароля).
  site:
    base-url: ${APP_SITE_BASE_URL:http://localhost:8080}
  # Почта: выключена по умолчанию (лог-провайдер). Включается флагом
  # APP_MAIL_ENABLED=true + MAIL_* ниже; письма — только транзакционные.
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:}
    reset-path: /login.html?mode=reset&token=
  jwt:
    # Прод-секрет — только из env (минимум 32 символа). Дефолт — для локалки.
    secret: ${APP_JWT_SECRET:dev-secret-change-me-in-prod-00000000}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 2592000
  cookies:
    # В проде за https — true (см. deploy/.env.example). Локально по http — false.
    secure: ${APP_COOKIES_SECURE:false}

# Тарифы тренажёра (те же числа, что на лендинге): Free — N задач с ревью.
# Секции верхнеуровневые: код читает billing.*, yookassa.*, review.*,
# ratelimit.* (не app.* — иначе env не биндятся, проверено чтением кода).
billing:
  free-review-tasks: 2
  pro-monthly-price: 990
  pro-yearly-price: 9480
  # Провайдер выбирается автоматически: ЮKassa при заданных ключах, иначе fake.
  fake-enabled: ${BILLING_FAKE_ENABLED:true}
  webhook-secret: ${BILLING_WEBHOOK_SECRET:}
# Ключи ЮKassa — только из env, в БД и логах их нет.
yookassa:
  shop-id: ${YOOKASSA_SHOP_ID:}
  secret-key: ${YOOKASSA_SECRET_KEY:}
# Движок ревью: mock (детерминированный) или llm (модели + фолбэк).
# Сами ключи моделей — в env (имена — в таблице провайдеров, см. V9__llm.sql).
review:
  engine: ${REVIEW_ENGINE:mock}
  llm:
    primary: ${REVIEW_LLM_PRIMARY:deepseek}
    fallback: ${REVIEW_LLM_FALLBACK:glm}
  limits:
    max-solution-chars: ${REVIEW_MAX_SOLUTION_CHARS:20000}
    max-input-bytes: ${REVIEW_MAX_INPUT_BYTES:64000}
    max-output-tokens: ${REVIEW_MAX_OUTPUT_TOKENS:2000}
    token-budget: ${REVIEW_TOKEN_BUDGET:160000}
    max-calls: ${REVIEW_MAX_CALLS:6}
  queue:
    enabled: ${REVIEW_QUEUE_ENABLED:true}
    workers: ${REVIEW_WORKERS:2}
    lease-seconds: ${REVIEW_LEASE_SECONDS:30}
    max-tries: ${REVIEW_MAX_TRIES:3}
    retry-seconds: ${REVIEW_RETRY_SECONDS:2}
    poll-ms: ${REVIEW_POLL_MS:500}
    heartbeat-ms: ${REVIEW_HEARTBEAT_MS:1000}
# Лимиты API (прод — через env при абузе).
ratelimit:
  register-per-min: ${RATELIMIT_REGISTER_PER_MIN:5}
  reset-per-min: ${RATELIMIT_RESET_PER_MIN:5}
  login-per-min: ${RATELIMIT_LOGIN_PER_MIN:20}
  submit-per-min: ${RATELIMIT_SUBMIT_PER_MIN:10}
  assessment-per-min: ${RATELIMIT_ASSESSMENT_PER_MIN:5}
  complaints-per-min: ${RATELIMIT_COMPLAINTS_PER_MIN:10}

spring:
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/analystgym}
    username: ${APP_DB_USER:analystgym}
    password: ${APP_DB_PASSWORD:analystgym}
    hikari:
      # VPS маленький (4 GB): пул держим скромным, иначе съест память про запас.
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      # Схемой владеет Flyway; Hibernate только сверяет маппинг с таблицами.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Валидация строгая: расхождение миграции с применённой — падать сразу, а не ехать.
    validate-on-migrate: true
  # SMTP-транспорт для SmtpNotificationService (включается APP_MAIL_ENABLED=true).
  # Без флага письма идут в лог, эти свойства не используются.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
