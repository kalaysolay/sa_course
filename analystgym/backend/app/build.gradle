// Точка входа приложения: Spring Boot + HTTP API + раздача статики.
// Версии Spring Boot фиксируем литералами здесь (их всего две).
plugins {
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.6'
}

dependencies {
    implementation project(':shared:kernel')
    implementation project(':shared:persistence')
    // Рантайм-модули Фазы 1: без них в app нет ни контроллеров, ни SecurityConfig
    // (симптом: дефолтная Basic-авторизация вместо нашей — WWW-Authenticate: Basic).
    // Новые модули следующих фаз добавляем сюда же строкой.
    implementation project(':modules:identity')
    implementation project(':modules:catalog')
    implementation project(':modules:practice')
    implementation project(':modules:review')
    implementation project(':modules:assessment')
    implementation project(':modules:quality')
    implementation project(':modules:admin')
    implementation project(':modules:notify')
    implementation project(':modules:billing')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit:1.4.0'
    // Classpath для ArchUnit-теста границ модулей (см. ModuleBoundariesTest):
    testImplementation project(':shared:persistence')
    testImplementation project(':modules:identity')
    testImplementation project(':modules:catalog')
    testImplementation project(':modules:practice')
    testImplementation project(':modules:review')
    testImplementation project(':modules:assessment')
    testImplementation project(':modules:courses')
    testImplementation project(':modules:content')
    testImplementation project(':modules:billing')
    testImplementation project(':modules:quality')
    testImplementation project(':modules:notify')
    testImplementation project(':modules:admin')
}

// Копирует макет в статику приложения (tasks-mockup -> resources/static).
// Исключаем около-сборочный мусор; docs/ оставляем (на них ссылается админка).
tasks.register('syncMockup', Sync) {
    description = 'Копирует tasks-mockup в статику приложения.'
    from("${rootDir}/../tasks-mockup") {
        exclude 'server.py', 'check-mockup.py', 'scripts/**', 'tests/**', 'assets/js/data-tasks-*.js', 'assets/js/questions.js'
    }
    into 'src/main/resources/static'
}

// Статика всегда свежая: сначала синхронизация, потом упаковка ресурсов.
processResources.dependsOn syncMockup
processResources {
    // Удаляем и старую копию из инкрементальной сборки: исключения Copy её не очищают.
    doFirst {
        delete fileTree("${layout.buildDirectory.get()}/resources/main/static/assets/js") {
            include 'data-tasks-*.js', 'questions.js'
        }
    }
}

// Полные сценарии безопасности проверяются на отдельной PostgreSQL в Docker.
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}
dependencies {
    integrationTestImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    integrationTestImplementation 'org.testcontainers:postgresql:1.20.4'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-mail'
}
tasks.register('integrationTest', Test) {
    description = 'Сценарии сессий и черновиков с реальной PostgreSQL (нужен Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    // Docker 29 отклоняет старый API по умолчанию у закреплённого Testcontainers 1.20.
    systemProperty 'api.version', System.getProperty('api.version', '1.44')
    shouldRunAfter test
}
