<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Диалог клиента и сервера</title><desc id="desc">Запрос GET applications и ответ 200 OK с JSON.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#3b424d"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#d3f26a" stroke-width="1.5"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#83a9da" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="440" rx="12" fill="#15191f"/><rect width="1000" height="440" fill="url(#grid)" opacity=".45"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="40" font-size="11" fill="#8b96a5" letter-spacing="2">ОДИН ЗАПРОС — ОДИН ОТВЕТ</text><text x="962" y="40" text-anchor="end" font-size="11" fill="#d3f26a">AnalystGYM / HTTP</text>
<rect x="45" y="132" width="190" height="175" rx="14" fill="#202630" stroke="#39414e"/><rect x="87" y="158" width="105" height="63" rx="5" fill="#15191f" stroke="#8490a1"/><path d="M87 175h105M126 221v15m-18 0h51" stroke="#8490a1"/><circle cx="98" cy="167" r="2" fill="#d3f26a"/><circle cx="106" cy="167" r="2" fill="#8796a9"/><text x="140" y="269" text-anchor="middle" font-size="19" fill="#e9ecf1">Клиент</text><text x="140" y="290" text-anchor="middle" font-size="11" fill="#8b96a5">Интерфейс приложения</text>
<rect x="765" y="132" width="190" height="175" rx="14" fill="#202630" stroke="#39414e"/><g stroke="#8490a1" fill="#15191f"><rect x="814" y="158" width="92" height="24" rx="4"/><rect x="814" y="191" width="92" height="24" rx="4"/></g><g fill="#d3f26a"><circle cx="825" cy="170" r="3"/><circle cx="825" cy="203" r="3"/></g><text x="860" y="269" text-anchor="middle" font-size="19" fill="#e9ecf1">Сервер</text><text x="860" y="290" text-anchor="middle" font-size="11" fill="#8b96a5">API сервиса заявок</text>
<path d="M267 175H730" stroke="#d3f26a" stroke-width="2" marker-end="url(#arrow)"/><text x="285" y="128" font-family="Consolas,monospace" font-size="17" fill="#d3f26a">GET /applications</text><text x="285" y="151" font-family="Consolas,monospace" font-size="12" fill="#a8b1bf">Accept: application/json</text>
<path d="M734 277H269" stroke="#83a9da" stroke-width="2" marker-end="url(#blue)"/><text x="285" y="229" font-family="Consolas,monospace" font-size="17" fill="#83a9da">200 OK</text><text x="285" y="252" font-family="Consolas,monospace" font-size="12" fill="#a8b1bf">Content-Type: application/json</text>
<rect x="282" y="312" width="436" height="65" rx="8" fill="#1c222b" stroke="#303947"/><text x="304" y="338" font-size="10" fill="#8490a1">ТЕЛО ОТВЕТА</text><text x="304" y="360" font-family="Consolas,monospace" font-size="13" fill="#e9ecf1">[{ "id": 101, "status": "NEW" }]</text><text x="38" y="413" font-size="11" fill="#788595">Метод → ресурс → контекст → данные</text>
</g></svg>
