<!doctype html><html><head><meta charset="utf-8"><title>seed-export</title></head><body><pre id="out">RUNNING</pre><script src="../assets/js/data-core.js"></script><script src="../assets/js/data-tasks-1.js"></script><script src="../assets/js/data-tasks-2.js"></script><script>
document.addEventListener("DOMContentLoaded", function() {
  try {
    var levels = SA_DATA.levels.map(function(l) { return { id: l.id, name: l.name, cssClass: l.cssClass, profile: l.profile, timeHint: l.timeHint, description: l.description, active: l.active !== false }; });
    var tags = SA_DATA.tags.map(function(t) { return { id: t.id, name: t.name, category: t.category, active: t.active !== false, synonyms: t.synonyms || [] }; });
    var collections = SA_DATA.collections.map(function(c) { return { id: c.id, name: c.name, tagline: c.tagline || "", description: c.description || "", icon: c.icon || "", audience: c.audience || "", taskIds: c.taskIds || [], active: c.active !== false }; });
    var tasks = SA_DATA.tasks.map(function(t) { return { id: t.id, title: t.title, level: t.level, tags: t.tags || [], timeMin: t.timeMin || 30, solvedRate: t.solvedRate || 0 }; });
    document.getElementById("out").textContent = JSON.stringify({ levels: levels, tags: tags, collections: collections, tasks: tasks });
  } catch (e) {
    document.getElementById("out").textContent = JSON.stringify({ fatal: String((e && e.message) || e) });
  }
});
</script></body></html>
