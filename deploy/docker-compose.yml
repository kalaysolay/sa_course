# Локальный и прод-стенд MVP: app + postgres + redis + caddy.
# Запуск из корня репозитория: docker compose -f deploy/docker-compose.yml up --build
# Переменные — только через .env (рядом лежит .env.example, секретов в репо нет).
services:
  app:
    # Вариант A: образ собирает CI и пушит в GHCR, прод только pull+up.
    # Локально: тот же compose с build (контекст — корень репо, см. Dockerfile).
    image: ghcr.io/kalaysolay/sa_course-app:latest
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Имя хоста БД внутри compose-сети — postgres (не localhost).
      - APP_DB_URL=jdbc:postgresql://postgres:5432/analystgym
      - APP_DB_USER=${POSTGRES_USER}
      - APP_DB_PASSWORD=${POSTGRES_PASSWORD}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      # За Caddy с https куки обязаны быть Secure, иначе браузер их не отдаст.
      - APP_COOKIES_SECURE=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: analystgym
    healthcheck:
      # $${} — экранирование от compose-интерполяции: переменную подставит контейнер.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
