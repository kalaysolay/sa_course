{
  "publisher": {
    "version": "0.3"
  },
  "revisions": {
    "lecture": 3,
    "assessment": 2,
    "project_artifacts": 3
  },
  "review": {
    "block_on": [
      "critical",
      "major"
    ],
    "max_minor_for_auto_approve": 5
  },
  "features": {
    "visuals": false,
    "google_drive_publish": false,
    "whole_module_generation": false,
    "experimental_project_artifacts": true,
    "experimental_project_auto_merge": false
  },
  "course_progress": {
    "auto_update": true,
    "maintain_human_readable_progress": true,
    "block_on_major_gap": true,
    "never_silently_skip_topic": true
  },
  "course_tracker": {
    "spreadsheet_url": "https://docs.google.com/spreadsheets/d/1She4DAsy9KIQ0uXdMDbTvtDsftT3BNBiorYMScyArew/edit",
    "spreadsheet_id": "1She4DAsy9KIQ0uXdMDbTvtDsftT3BNBiorYMScyArew",
    "sheet_name": "План лекций",
    "topic_id_column": "H",
    "header_row": 4,
    "data_start_row": 5,
    "columns": {
      "lesson_tree": "A",
      "lecture_generated": "B",
      "lecture_edited": "C",
      "artifacts": "D",
      "artifact_status": "E",
      "lesson_status": "F",
      "course_order": "G",
      "topic_id": "H",
      "output": "I",
      "run_id": "J"
    }
  },
  "curriculum": {
    "author_controlled": true,
    "require_topic_passport": true
  },
  "sources": {
    "registry_required": true
  },
  "logging": {
    "events_jsonl": true,
    "keep_drafts": true,
    "keep_reviews": true
  },
  "llm": {
    "default_adapter": "codex",
    "openai": {
      "model": "gpt-5.6-terra",
      "reasoning_effort": "medium",
      "temperature": 0.3,
      "api_key_env": "OPENAI_API_KEY"
    },
    "codex": {
      "task_packet_dir": "codex-tasks",
      "external_api_required": false,
      "execution_surface": "Codex/ChatGPT desktop app",
      "supports_multi_agent_dispatch": true
    }
  }
}
